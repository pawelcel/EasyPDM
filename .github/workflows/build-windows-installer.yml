name: Build Windows Installer

# Buduje frontend + self-contained backend (win-x64) i kompiluje packaging/windows/EasyPDM.iss
# do prawdziwego EasyPDMSetup.exe na windowsowym runnerze GitHuba (ma Inno Setup Compiler
# preinstalowany, w odróżnieniu od lokalnego środowiska deweloperskiego opartego o Linux) —
# efekt trafia jako pobieralny artefakt tego przebiegu, bez potrzeby posiadania Windows/Inno
# Setup lokalnie przez kogokolwiek.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Buduj frontend
        working-directory: EasyPDM.Web
        run: |
          npm ci
          npm run build

      - name: Publikuj backend (self-contained, win-x64)
        run: >
          dotnet publish EasyPDM.Api -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o packaging/windows/publish

      - name: Kompiluj instalator (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\EasyPDM.iss

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDMSetup
          path: packaging/windows/Output/EasyPDMSetup.exe
          if-no-files-found: error
