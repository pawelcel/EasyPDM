name: Build Windows Installer

# Buduje frontend + self-contained backend (win-x64) i kompiluje packaging/windows/EasyPDM.iss
# do prawdziwego EasyPDMSetup.exe na windowsowym runnerze GitHuba (ma Inno Setup Compiler
# preinstalowany, w odróżnieniu od lokalnego środowiska deweloperskiego opartego o Linux) —
# efekt trafia jako pobieralny artefakt tego przebiegu, bez potrzeby posiadania Windows/Inno
# Setup lokalnie przez kogokolwiek.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Buduj frontend
        working-directory: EasyPDM.Web
        run: |
          npm ci
          npm run build

      - name: Publikuj backend (self-contained, win-x64)
        run: >
          dotnet publish EasyPDM.Api -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o packaging/windows/publish

      - name: Kompiluj instalator (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\EasyPDM.iss

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDMSetup
          path: packaging/windows/Output/EasyPDMSetup.exe
          if-no-files-found: error

      # Od tego miejsca: prawdziwy test end-to-end samej INSTALACJI (nie tylko kompilacji
      # skryptu) — czego nie dało się zweryfikować wcześniej. Runner windows-latest nie ma
      # PostgreSQL domyślnie, więc doinstalowujemy je przez Chocolatey (preinstalowane na
      # tym runnerze), z góry ustawiając hasło superużytkownika "postgres" — to samo hasło
      # podajemy potem instalatorowi przez /PGPASSWORD, żeby /VERYSILENT (bez interakcji)
      # mogło w ogóle założyć rolę/bazę EasyPDM.
      - name: Zainstaluj PostgreSQL (Chocolatey) — do testu instalatora
        shell: pwsh
        run: choco install postgresql -y --params "/Password:postgres" --no-progress

      - name: Diagnostyka — gdzie Chocolatey faktycznie zainstalował psql.exe
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files\PostgreSQL" -Recurse -Filter psql.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      - name: Uruchom EasyPDMSetup.exe w trybie cichym (/VERYSILENT)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "packaging\windows\Output\EasyPDMSetup.exe").Path
          $logPath = Join-Path $PWD "install.log"
          # Start-Process -PassThru zamiast "& $exe ...; $LASTEXITCODE" — to drugie w tym
          # przebiegu CI dało PUSTY (nie zerowy, PUSTY) kod wyjścia, co wygląda na to, że
          # $LASTEXITCODE po prostu nie ustawił się tak, jak oczekiwano dla tego procesu;
          # Start-Process zwraca jawny obiekt z niezawodną właściwością .ExitCode.
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/PGPASSWORD=postgres", "/LOG=$logPath"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia instalatora: $($proc.ExitCode)"
          Write-Host "=== install.log ==="
          Get-Content $logPath -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Error "EasyPDMSetup.exe zakończył się kodem $($proc.ExitCode)."
            exit 1
          }

      - name: Sprawdź, czy usługa wystartowała i serwer odpowiada
        shell: pwsh
        run: |
          sc.exe query EasyPDM
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:5000 -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Error "EasyPDM nie odpowiedziało pod http://localhost:5000 po instalacji."
            exit 1
          }
          Write-Host "EasyPDM odpowiada poprawnie po świeżej instalacji."

      # Uruchomienie instalatora DRUGI RAZ symuluje aktualizację — sprawdza, że wykrywa
      # istniejącą rolę/bazę/usługę (nie próbuje zakładać ich od nowa) i poprawnie
      # restartuje usługę zamiast się wywalić na "usługa już istnieje".
      - name: Uruchom instalator drugi raz (symulacja aktualizacji)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "packaging\windows\Output\EasyPDMSetup.exe").Path
          $logPath = Join-Path $PWD "install2.log"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/PGPASSWORD=postgres", "/LOG=$logPath"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia instalatora: $($proc.ExitCode)"
          Write-Host "=== install2.log ==="
          Get-Content $logPath -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Error "Drugie uruchomienie EasyPDMSetup.exe zakończyło się kodem $($proc.ExitCode)."
            exit 1
          }

      - name: Sprawdź, czy serwer odpowiada też po "aktualizacji"
        shell: pwsh
        run: |
          sc.exe query EasyPDM
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:5000 -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Error "EasyPDM nie odpowiedziało pod http://localhost:5000 po drugiej instalacji."
            exit 1
          }
          Write-Host "EasyPDM odpowiada poprawnie po symulowanej aktualizacji."
