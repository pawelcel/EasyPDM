name: Build Windows Installer

# Buduje frontend + self-contained backend (win-x64) i kompiluje packaging/windows/EasyPDM.iss
# do prawdziwego instalatora (EasyPDM_Windows_v{wersja}.exe — nazwa niesie numer wersji z
# MyAppVersion w EasyPDM.iss) na windowsowym runnerze GitHuba (ma Inno Setup Compiler
# preinstalowany, w odróżnieniu od lokalnego środowiska deweloperskiego opartego o Linux) —
# efekt trafia jako pobieralny artefakt tego przebiegu, bez potrzeby posiadania Windows/Inno
# Setup lokalnie przez kogokolwiek.
on:
  workflow_dispatch:
  # Wołane też z create-release-draft.yml (fan-in: ten workflow + build-linux-package.yml
  # razem tworzą artefakty, z których create-release-draft.yml składa szkic Release'a) —
  # "outputs" niżej wynosi nazwę zbudowanego artefaktu do workflow wołającego, żeby mógł
  # go pobrać przez actions/download-artifact bez zgadywania/parsowania nazwy.
  workflow_call:
    outputs:
      artifact-name:
        description: "Nazwa artefaktu (instalator Windows)"
        value: ${{ jobs.build.outputs.artifact-name }}
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.setup_exe.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Buduj frontend
        working-directory: EasyPDM.Web
        run: |
          npm ci
          npm run build

      - name: Publikuj backend (self-contained, win-x64)
        run: >
          dotnet publish EasyPDM.Api -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o packaging/windows/publish

      - name: Kompiluj instalator (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\EasyPDM.iss

      # Nazwa pliku niesie numer wersji (OutputBaseFilename w EasyPDM.iss, np.
      # "EasyPDM_Windows_v0.1.exe") -- odczytujemy ją tutaj zamiast hardkodować w tym
      # workflow, żeby nazwa artefaktu i kolejne kroki same nadążały za bumpem wersji.
      - name: Odczytaj nazwę zbudowanego instalatora
        id: setup_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging\windows\Output\*.exe" | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$([System.IO.Path]::GetFileNameWithoutExtension($exe.Name))" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.setup_exe.outputs.name }}
          path: ${{ steps.setup_exe.outputs.path }}
          if-no-files-found: error

      # Od tego miejsca: prawdziwy test end-to-end samej INSTALACJI (nie tylko kompilacji
      # skryptu) — czego nie dało się zweryfikować wcześniej. Z góry ustawiamy hasło
      # superużytkownika PostgreSQL na "postgres" — to samo hasło podajemy potem instalatorowi
      # przez /PGPASSWORD, żeby /VERYSILENT (bez interakcji) mogło w ogóle założyć rolę/bazę
      # EasyPDM. windows-latest ma PostgreSQL preinstalowany fabrycznie (aktualnie wersja 17). Instalacja
      # przez pakiet Chocolatey "postgresql"/"postgresql18" okazała się niewiarygodna w tym
      # środowisku — niezależnie od /params, --params-global czy odinstalowania preinstalowanej
      # wersji jej własnym deinstalatorem, pakiet i tak po cichu generował LOSOWE hasło
      # superużytkownika zamiast naszego (widać to po "WARNING: ... insecure one has been
      # generated for you" w logu za każdym razem) — wygląda na to, że warstwa tłumaczenia
      # parametrów tego pakietu (Get-PackageParameters w jego chocolateyInstall.ps1) ma jakąś
      # osobliwość związaną z wykrywaniem istniejącej instalacji na tym konkretnym obrazie
      # runnera. Zamiast dalej próbować obejść tę warstwę, pobieramy i uruchamiamy PRAWDZIWY
      # instalator EDB bezpośrednio, z jego własnymi, udokumentowanymi flagami wiersza poleceń
      # (--superpassword, --serverport) — to ten sam plik .exe, który i tak pobierał pakiet
      # Chocolatey (adres z jego logu), tylko bez pośredniej warstwy, która zawodziła.
      - name: Zatrzymaj preinstalowany PostgreSQL na runnerze (zwalnia port 5432)
        shell: pwsh
        run: |
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Zatrzymuję usługę $($_.Name) (status: $($_.Status))"
            Stop-Service -Name $_.Name -Force -ErrorAction SilentlyContinue
          }

      - name: Zainstaluj PostgreSQL 18 (bezpośrednio przez instalator EDB) — do testu instalatora
        shell: pwsh
        run: |
          $installerUrl = "https://get.enterprisedb.com/postgresql/postgresql-18.4-1-windows-x64.exe"
          $installerPath = Join-Path $env:TEMP "postgresql-18-installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $proc = Start-Process -FilePath $installerPath -ArgumentList @(
            "--mode", "unattended", "--unattendedmodeui", "none",
            "--superpassword", "postgres", "--serverport", "5432",
            "--disable-components", "stackbuilder"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia instalatora PostgreSQL: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Instalacja PostgreSQL zakończyła się kodem $($proc.ExitCode)."
            exit 1
          }

      - name: Diagnostyka — gdzie zainstalował się psql.exe
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files\PostgreSQL" -Recurse -Filter psql.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      # Szybka weryfikacja PRZED uruchomieniem instalatora — jeśli hasło jednak się nie
      # ustawiło, ten krok pada w kilka sekund z jasnym komunikatem, zamiast dowiadywać się
      # o tym dopiero po całym ~15-minutowym cyklu instalacja+polling usługi.
      - name: Zweryfikuj, że hasło superużytkownika PostgreSQL faktycznie zostało ustawione
        shell: pwsh
        run: |
          $psql = (Get-ChildItem "C:\Program Files\PostgreSQL" -Recurse -Filter psql.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*pgAdmin*" } |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $env:PGPASSWORD = "postgres"
          & $psql -h localhost -U postgres -c "SELECT 1;" postgres
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Nie udało się połączyć jako postgres/postgres po instalacji PostgreSQL — hasło superużytkownika nie zostało poprawnie ustawione."
            exit 1
          }
          Write-Host "Połączenie jako postgres/postgres działa poprawnie."

      - name: Uruchom instalator w trybie cichym (/VERYSILENT)
        shell: pwsh
        run: |
          $exe = "${{ steps.setup_exe.outputs.path }}"
          $logPath = Join-Path $PWD "install.log"
          # Start-Process -PassThru zamiast "& $exe ...; $LASTEXITCODE" — to drugie w tym
          # przebiegu CI dało PUSTY (nie zerowy, PUSTY) kod wyjścia, co wygląda na to, że
          # $LASTEXITCODE po prostu nie ustawił się tak, jak oczekiwano dla tego procesu;
          # Start-Process zwraca jawny obiekt z niezawodną właściwością .ExitCode.
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/PGPASSWORD=postgres", "/LOG=$logPath"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia instalatora: $($proc.ExitCode)"
          Write-Host "=== install.log ==="
          Get-Content $logPath -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Error "Instalator zakończył się kodem $($proc.ExitCode)."
            exit 1
          }

      - name: Sprawdź, czy usługa wystartowała i serwer odpowiada
        shell: pwsh
        run: |
          sc.exe query EasyPDM
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:5000 -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Host "::group::Diagnostyka — install-debug.log (log instalatora [Code], nie sam Inno Setup)"
            Get-Content "C:\ProgramData\EasyPDM\install-debug.log" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"

            Write-Host "::group::Diagnostyka — appsettings.Production.json (hasło ukryte)"
            (Get-Content "C:\Program Files\EasyPDM\appsettings.Production.json" -ErrorAction SilentlyContinue) `
              -replace 'Password=[^"]*', 'Password=***'
            Write-Host "::endgroup::"

            Write-Host "::group::Diagnostyka — logi aplikacji (%ProgramData%\EasyPDM\logs)"
            Get-ChildItem "C:\ProgramData\EasyPDM\logs" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName -ErrorAction SilentlyContinue
            }
            Write-Host "::endgroup::"

            Write-Host "::group::Diagnostyka — zdarzenia Dziennika zdarzeń Windows (Application)"
            Get-WinEvent -LogName Application -MaxEvents 2000 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like "*EasyPDM*" -or $_.ProviderName -like "*.NET*" } |
              Select-Object -First 20 TimeCreated, ProviderName, Id, Message | Format-List
            Write-Host "::endgroup::"

            Write-Host "::group::Diagnostyka — bezpośrednie uruchomienie EXE w konsoli (nie jako usługa)"
            $consoleOut = Join-Path $PWD "console-run.log"
            $p = Start-Process -FilePath "C:\Program Files\EasyPDM\EasyPDM.Api.exe" `
              -WorkingDirectory "C:\Program Files\EasyPDM" `
              -RedirectStandardOutput $consoleOut -RedirectStandardError "$consoleOut.err" `
              -PassThru
            Start-Sleep -Seconds 8
            if (-not $p.HasExited) { $p.Kill() }
            Write-Host "--- stdout ---"
            Get-Content $consoleOut -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content "$consoleOut.err" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"

            Write-Error "EasyPDM nie odpowiedziało pod http://localhost:5000 po instalacji."
            exit 1
          }
          Write-Host "EasyPDM odpowiada poprawnie po świeżej instalacji."

      # Uruchomienie instalatora DRUGI RAZ symuluje aktualizację — sprawdza, że wykrywa
      # istniejącą rolę/bazę/usługę (nie próbuje zakładać ich od nowa) i poprawnie
      # restartuje usługę zamiast się wywalić na "usługa już istnieje".
      - name: Uruchom instalator drugi raz (symulacja aktualizacji)
        shell: pwsh
        run: |
          $exe = "${{ steps.setup_exe.outputs.path }}"
          $logPath = Join-Path $PWD "install2.log"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/PGPASSWORD=postgres", "/LOG=$logPath"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia instalatora: $($proc.ExitCode)"
          Write-Host "=== install2.log ==="
          Get-Content $logPath -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Error "Drugie uruchomienie instalatora zakończyło się kodem $($proc.ExitCode)."
            exit 1
          }

      - name: Sprawdź, czy serwer odpowiada też po "aktualizacji"
        shell: pwsh
        run: |
          sc.exe query EasyPDM
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri http://localhost:5000 -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Host "::group::Diagnostyka — install-debug.log"
            Get-Content "C:\ProgramData\EasyPDM\install-debug.log" -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Write-Error "EasyPDM nie odpowiedziało pod http://localhost:5000 po drugiej instalacji."
            exit 1
          }
          Write-Host "EasyPDM odpowiada poprawnie po symulowanej aktualizacji."

      # Analogicznie do test-linux-installer.yml — CurUninstallStepChanged (w EasyPDM.iss)
      # zatrzymuje i usuwa usługę, ale celowo NIE rusza bazy/roli PostgreSQL (deinstalacja
      # nie powinna kasować danych użytkownika), więc weryfikujemy tylko to, co uninstaller
      # faktycznie ma zrobić: usługa ma zniknąć z SCM.
      - name: Odinstaluj EasyPDM i sprawdź, że usługa zniknęła
        shell: pwsh
        run: |
          $uninstaller = "C:\Program Files\EasyPDM\unins000.exe"
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          Write-Host "Kod wyjścia deinstalatora: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Deinstalator zakończył się kodem $($proc.ExitCode)."
            exit 1
          }

          Start-Sleep -Seconds 3
          # "sc.exe query" na nieistniejącej usłudze kończy się kodem 1060 — to oczekiwany
          # wynik tutaj, ale zostawia $LASTEXITCODE=1060, a pwsh w Actions traktuje resztkowy
          # $LASTEXITCODE na końcu skryptu jako wynik całego kroku (nawet jeśli nasza własna
          # logika już poprawnie rozpoznała sukces) — bez jawnego "exit 0" krok padałby mimo
          # poprawnego wyniku.
          $svcOutput = sc.exe query EasyPDM 2>&1 | Out-String
          Write-Host $svcOutput
          if ($svcOutput -notmatch "1060") {
            Write-Error "Usługa EasyPDM nadal istnieje po odinstalowaniu."
            exit 1
          }
          Write-Host "Usługa EasyPDM poprawnie usunięta po odinstalowaniu."
          exit 0
