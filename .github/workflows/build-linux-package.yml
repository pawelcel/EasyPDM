name: Build Linux Package

# Buduje frontend + self-contained backend (linux-x64) i pakuje je razem z
# install-easypdm-linux.sh/uninstall-easypdm-linux.sh/db/schema.sql w jedno archiwum
# "EasyPDM-Linux-x64_v{wersja}.tar.gz" (numer wersji czytany z MyAppVersion w
# packaging/windows/EasyPDM.iss -- jedyne miejsce, gdzie jest dziś śledzony) -- pobieralny
# artefakt tego przebiegu, analogicznie do build-windows-installer.yml, tylko że tu nie ma
# jednego pliku wykonywalnego-instalatora (Linux nie ma odpowiednika Inno Setup w tym repo)
# -- paczka zawiera już zbudowaną aplikację + skrypt instalujący ją jako usługę systemd,
# więc docelowa maszyna NIE potrzebuje .NET SDK ani Node.js, tylko odpakować i uruchomić
# skrypt.
on:
  workflow_dispatch:
  # Wołane też z create-release-draft.yml (fan-in: ten workflow + build-windows-installer.yml
  # razem tworzą artefakty, z których create-release-draft.yml składa szkic Release'a) —
  # "outputs" niżej wynosi nazwę zbudowanej paczki do workflow wołającego, żeby mógł ją
  # pobrać przez actions/download-artifact bez zgadywania/parsowania nazwy.
  workflow_call:
    outputs:
      artifact-name:
        description: "Nazwa artefaktu (paczka Linux)"
        value: ${{ jobs.build.outputs.artifact-name }}
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "install-easypdm-linux.sh"
      - "uninstall-easypdm-linux.sh"
      - ".github/workflows/build-linux-package.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.package.outputs.pkg-name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Buduj frontend
        working-directory: EasyPDM.Web
        run: |
          npm ci
          npm run build

      - name: Publikuj backend (self-contained, linux-x64)
        run: >
          dotnet publish EasyPDM.Api -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -o pkg/publish

      # Wersja czytana z packaging/windows/EasyPDM.iss (MyAppVersion) -- jedyne miejsce w
      # repo, gdzie numer wersji jest dziś śledzony -- żeby nazwa paczki Linuksa i instalatora
      # Windows nie mogły się rozjechać (dwa osobne hardkodowane numery wersji łatwo
      # zapomnieć zbumpować oba naraz).
      - name: Odczytaj wersję
        id: version
        run: |
          VERSION=$(grep -oP '(?<=#define MyAppVersion ")[^"]+' packaging/windows/EasyPDM.iss)
          echo "Wersja: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Złóż paczkę
        id: package
        env:
          PKG_NAME: EasyPDM-Linux-x64_v${{ steps.version.outputs.version }}
        run: |
          mkdir -p pkg/db
          cp db/schema.sql pkg/db/schema.sql
          cp install-easypdm-linux.sh pkg/
          cp uninstall-easypdm-linux.sh pkg/
          chmod +x pkg/install-easypdm-linux.sh pkg/uninstall-easypdm-linux.sh
          tar czf "$PKG_NAME.tar.gz" -C pkg .
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "pkg-name=$PKG_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error

      # Prawdziwy test end-to-end SAMEJ PACZKI (tryb PACKAGE_MODE w install-easypdm-linux.sh),
      # analogicznie do test-linux-installer.yml, które testuje tylko tryb budowania z
      # repo -- bez tego test-linux-installer.yml nie łapałby regresji specyficznych dla
      # ścieżki "gotowa paczka bez .NET SDK/npm na maszynie docelowej".
      - name: Rozpakuj paczkę do czystego katalogu (symulacja pobrania przez użytkownika)
        run: |
          mkdir -p /tmp/easypdm-package-test
          tar xzf "$PKG_NAME.tar.gz" -C /tmp/easypdm-package-test

      - name: Zainstaluj z paczki (bez budowania)
        working-directory: /tmp/easypdm-package-test
        run: sudo ./install-easypdm-linux.sh

      - name: Sprawdź status usługi i odpowiedź serwera
        run: |
          systemctl status easypdm --no-pager
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "EasyPDM odpowiada poprawnie po instalacji z paczki."
              exit 0
            fi
            sleep 2
          done
          echo "::error::EasyPDM nie odpowiedziało pod http://localhost:5000 po instalacji z paczki."
          journalctl -u easypdm --no-pager | tail -100
          exit 1

      - name: Odinstaluj
        working-directory: /tmp/easypdm-package-test
        run: sudo ./uninstall-easypdm-linux.sh

      - name: Sprawdź, że usługa faktycznie zniknęła
        run: |
          if systemctl status easypdm --no-pager 2>&1 | grep -q "could not be found"; then
            echo "Usługa poprawnie usunięta."
          else
            echo "::error::Usługa easypdm wciąż istnieje po odinstalowaniu."
            systemctl status easypdm --no-pager || true
            exit 1
          fi
