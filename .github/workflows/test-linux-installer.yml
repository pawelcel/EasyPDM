name: Test Linux Installer

# Uruchamia NAPRAWDĘ install-easypdm-linux.sh na czystym Ubuntu (runner ma sudo bez hasła,
# czego zabrakło w lokalnym środowisku deweloperskim, gdzie ten skrypt dało się tylko
# przejrzeć/zweryfikować składniowo) — sprawdza pełną instalację od zera, "aktualizację"
# (drugie uruchomienie), wybór portu (zachowanie przy aktualizacji, PDM_PORT, zajęty 5000),
# język komunikatów i odinstalowanie.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "install-easypdm-linux.sh"
      - "uninstall-easypdm-linux.sh"
      - ".github/workflows/test-linux-installer.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Każde uruchomienie instalatora zapisuje swój wynik do pliku, a kolejny krok sprawdza, co
      # ogłosił — i czy pod ogłoszonym adresem odpowiada naprawdę EasyPDM (tytuł strony), a nie
      # cokolwiek. Runner ma locale C.UTF-8, więc domyślnie komunikaty są angielskie.
      # Maszyna programisty: na tym samym PostgreSQL jest już baza "pdm" z rolą "pdm_user" — te
      # same nazwy, których instalator używał do 0.6. Przejmował ją wtedy i zmieniał hasło roli
      # (wyłapane w praktyce). Ma ją zostawić w spokoju przez cały test: instalację, aktualizację
      # i oba warianty deinstalacji.
      - name: "Symulacja bazy deweloperskiej (pdm / pdm_user)"
        run: |
          sudo apt-get install -y postgresql > /dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE pdm_user LOGIN PASSWORD 'dev';"
          sudo -u postgres createdb -O pdm_user pdm
          PGPASSWORD=dev psql -h localhost -U pdm_user -d pdm -c "CREATE TABLE dev_marker(x int); INSERT INTO dev_marker VALUES (42);"

      - name: Zainstaluj od zera
        run: |
          set -o pipefail
          sudo ./install-easypdm-linux.sh | tee install-1.log

      - name: "Świeża instalacja: port 5000, komunikaty po angielsku"
        run: |
          grep -F "EasyPDM is running at http://localhost:5000" install-1.log
          if grep -qF "was taken" install-1.log; then
            echo "::error::Wolny port 5000, a instalator twierdzi, że był zajęty."; exit 1
          fi
          curl -sf http://localhost:5000/ | grep -q '<title>EasyPDM'
          systemctl status easypdm --no-pager
          # Własna baza i rola, a baza deweloperska nietknięta — z tym samym hasłem i danymi.
          sudo grep -q 'Database=easypdm;Username=easypdm;' /etc/easypdm/easypdm.env
          PGPASSWORD=dev psql -h localhost -U pdm_user -d pdm -tAc "SELECT x FROM dev_marker" | grep -qx 42
          sudo grep '^ConnectionString=' /etc/easypdm/easypdm.env > cs-before.txt

      # Język z ustawień systemu, nie z wymuszenia: LC_ALL i LANGUAGE puste, żeby decydował LANG.
      - name: "Aktualizacja po polsku: port zostaje ten sam"
        run: |
          set -o pipefail
          sudo LC_ALL= LANGUAGE= LANG=pl_PL.UTF-8 ./install-easypdm-linux.sh | tee install-2.log

      - name: Sprawdź aktualizację
        run: |
          grep -F "EasyPDM działa pod http://localhost:5000" install-2.log
          grep -F "już istnieje" install-2.log
          # Aktualizacja zostaje przy swojej bazie i swoim haśle (dotąd generowała nowe za każdym razem).
          sudo grep '^ConnectionString=' /etc/easypdm/easypdm.env | diff - cs-before.txt
          curl -sf http://localhost:5000/ | grep -q '<title>EasyPDM'

      - name: "PDM_PORT przenosi usługę na wskazany port"
        run: |
          set -o pipefail
          sudo PDM_PORT=5055 ./install-easypdm-linux.sh | tee install-3.log

      - name: Sprawdź przeniesienie
        run: |
          grep -F "EasyPDM is running at http://localhost:5055" install-3.log
          curl -sf http://localhost:5055/ | grep -q '<title>EasyPDM'
          if curl -sf http://localhost:5000/ > /dev/null; then
            echo "::error::Usługa nadal odpowiada na starym porcie 5000."; exit 1
          fi

      - name: Odinstaluj
        run: |
          set -o pipefail
          sudo ./uninstall-easypdm-linux.sh | tee uninstall-1.log

      - name: Sprawdź, że usługa faktycznie zniknęła
        run: |
          # Bez terminala deinstalator nie pyta i dane zostawia.
          grep -F "The data was kept" uninstall-1.log
          test -n "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='easypdm'")"
          if systemctl status easypdm --no-pager 2>&1 | grep -q "could not be found"; then
            echo "Usługa poprawnie usunięta."
          else
            echo "::error::Usługa easypdm wciąż istnieje po odinstalowaniu."
            systemctl status easypdm --no-pager || true
            exit 1
          fi

      # Port 5000 trzyma inny program (tak jak EasyPDM w Dockerze na tej samej maszynie). Dotąd
      # usługa padała na zajętym porcie, a instalator i tak pisał, że działa pod :5000.
      - name: "Zajęty port 5000: instalator bierze następny wolny"
        run: |
          set -o pipefail
          python3 -m http.server 5000 --bind 127.0.0.1 > /dev/null 2>&1 &
          echo $! > blocker.pid
          sleep 1
          sudo ./install-easypdm-linux.sh | tee install-4.log

      - name: Sprawdź wybór portu
        run: |
          grep -F "EasyPDM is running at http://localhost:5001" install-4.log
          grep -F "Port 5000 was taken, so 5001 was chosen" install-4.log
          curl -sf http://localhost:5001/ | grep -q '<title>EasyPDM'
          if curl -s http://localhost:5000/ | grep -q '<title>EasyPDM'; then
            echo "::error::Na porcie 5000 miał zostać inny program."; exit 1
          fi

      - name: "Odinstaluj z usunięciem danych (PDM_REMOVE_DATA=yes)"
        run: |
          set -o pipefail
          sudo PDM_REMOVE_DATA=yes ./uninstall-easypdm-linux.sh | tee uninstall-2.log

      - name: "Sprawdź: dane EasyPDM usunięte, baza deweloperska nietknięta"
        run: |
          grep -F "Removed the database 'easypdm'" uninstall-2.log
          test -z "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='easypdm'")"
          test -z "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='easypdm'")"
          test ! -e /var/lib/easypdm
          PGPASSWORD=dev psql -h localhost -U pdm_user -d pdm -tAc "SELECT x FROM dev_marker" | grep -qx 42

      - name: Posprzątaj
        if: always()
        run: |
          kill "$(cat blocker.pid)" 2>/dev/null || true
          sudo ./uninstall-easypdm-linux.sh || true
