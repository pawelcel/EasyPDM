name: Publish Docker Image

# Buduje obraz "api" (Dockerfile w korzeniu repo — backend + zbudowany frontend) i publikuje
# go do GitHub Container Registry (ghcr.io) przy każdym pushu na main dotykającym kodu
# serwera. Dzięki temu wdrożenie Dockerem NIE wymaga już klonowania całego repo (ze
# wszystkimi makrami CAD/instalatorami/testami, których wdrożenie serwera w ogóle nie
# potrzebuje) — wystarczą same docker-compose.yml + .env, "docker compose pull" ściąga
# gotowy obraz zamiast budować go lokalnie ze źródeł.
#
# UWAGA: przy PIERWSZYM opublikowaniu pakiet w GHCR domyślnie jest PRYWATNY, niezależnie od
# widoczności samego repo — trzeba go raz ręcznie przełączyć na publiczny (GitHub -> zakładka
# "Packages" przy repo -> easypdm-api -> Package settings -> Change visibility), inaczej
# "docker compose pull" bez wcześniejszego "docker login ghcr.io" dostanie 403/404. Jeśli
# repo jest prywatne i pakiet ma zostać prywatny też — każda maszyna wdrożeniowa potrzebuje
# własnego "docker login ghcr.io" z tokenem (uprawnienie read:packages).
on:
  push:
    branches: [main]
    paths:
      - "EasyPDM.Api/**"
      - "EasyPDM.Web/**"
      - "db/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish-docker-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Zaloguj do GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dwa tagi: "latest" (do zwykłego "docker compose pull") i sam commit SHA (do
      # ewentualnego przypięcia/wycofania konkretnej wersji, niezależnie od tego, co akurat
      # wskazuje "latest").
      - name: Buduj i publikuj obraz
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/easypdm-api:latest
            ghcr.io/${{ github.repository_owner }}/easypdm-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
