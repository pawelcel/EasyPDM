name: Create Release Draft

# Po wypchnięciu taga wersji ("vX.Y.Z"): buduje instalator Windows i paczkę Linux (te same
# workflowy co "on: push do main", wołane tu jako reużywalne przez workflow_call — zob.
# "outputs" w build-windows-installer.yml/build-linux-package.yml), kopiuje makra Inventora
# i FreeCAD pod nazwami z numerem wersji (zob. "Przygotuj makra CAD" niżej), potem tworzy
# SZKIC (draft) Release'a na GitHubie z tymi plikami i notatkami wyciągniętymi z
# CHANGELOG.md. Świadomie NIE publikuje go automatycznie — to jedyny moment w całym
# procesie wydania, który zostaje ręczny: ktoś musi przejrzeć szkic i kliknąć
# "Publish release" na GitHubie. Obraz Docker (":latest"/":vX.Y.Z") publikuje się
# niezależnie, tym samym pushem taga, przez osobny publish-docker-release.yml.
#
# Makra SolidWorks świadomie NIE są tu dodawane -- w odróżnieniu od Inventora/FreeCAD,
# których pliki źródłowe (.bas/.FCMacro) trafiają do release'u wprost z repo, poprzednie
# release'e dołączały SolidWorks jako skompilowane .swp (zob. v0.1/v0.2 assets), co wymaga
# ręcznej kompilacji na żywym SolidWorks -- dorzucane do szkicu ręcznie.
on:
  push:
    tags:
      - "v*"

jobs:
  # Sprawdza PRZED zbudowaniem czegokolwiek (te dwa buildy trwają razem ~15-20 min), że
  # wersja w pushniętym tagu faktycznie zgadza się z oboma ręcznie utrzymywanymi numerami
  # wersji w repo — bez tego łatwo zapomnieć zaktualizować EasyPDM.iss/version.ts przed
  # tagowaniem, a wynikiem byłby Release opisany właściwym tagiem/CHANGELOG-iem, ale z
  # instalatorami wciąż podpisanymi starym numerem wersji.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sprawdź zgodność wersji z tagiem
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ISS_VERSION=$(grep -oP '(?<=#define MyAppVersion ")[^"]+' packaging/windows/EasyPDM.iss)
          WEB_VERSION=$(grep -oP '(?<=APP_VERSION = ")[^"]+' EasyPDM.Web/src/version.ts)
          echo "Tag: $TAG_VERSION | EasyPDM.iss (MyAppVersion): $ISS_VERSION | version.ts (APP_VERSION): $WEB_VERSION"
          if [ "$TAG_VERSION" != "$ISS_VERSION" ] || [ "$TAG_VERSION" != "$WEB_VERSION" ]; then
            echo "::error::Niezgodność wersji — tag mówi '$TAG_VERSION', ale EasyPDM.iss ma '$ISS_VERSION', a version.ts ma '$WEB_VERSION'. Zaktualizuj oba pliki na '$TAG_VERSION', scommituj i wypchnij tag ponownie."
            exit 1
          fi

  windows:
    needs: check-version
    uses: ./.github/workflows/build-windows-installer.yml

  linux:
    needs: check-version
    uses: ./.github/workflows/build-linux-package.yml

  draft-release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.windows.outputs.artifact-name }}
          path: artifacts/windows

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.linux.outputs.artifact-name }}
          path: artifacts/linux

      # Osobne pliki (nie zip), nazwane jak dotychczasowe ręcznie dorzucane assety FreeCAD w
      # v0.2 (EasyPDM_FreeCad_Upload_v0.2.FCMacro / EasyPDM_FreeCad_Download_v0.2.FCMacro) --
      # tylko kod źródłowy makra, bez README (tak samo jak dotąd). Każdy plik to gotowy,
      # importowalny kod wprost z repo, bez żadnego kroku budowania.
      - name: Przygotuj makra CAD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts/macros
          cp EasyPDM.Inventor/EasyPDMUpload.bas   "artifacts/macros/EasyPDM_Inventor_Upload_v${VERSION}.bas"
          cp EasyPDM.Inventor/EasyPDMDownload.bas "artifacts/macros/EasyPDM_Inventor_Download_v${VERSION}.bas"
          cp EasyPDM.FreeCad/EasyPDMUpload.FCMacro   "artifacts/macros/EasyPDM_FreeCad_Upload_v${VERSION}.FCMacro"
          cp EasyPDM.FreeCad/EasyPDMDownload.FCMacro "artifacts/macros/EasyPDM_FreeCad_Download_v${VERSION}.FCMacro"

      # Tag to np. "v0.2", nagłówek w CHANGELOG.md to "## [0.2]" (bez "v") — wycina samą
      # sekcję dla tej wersji (od nagłówka do NASTĘPNEGO "## [", wyłącznie), do notatek
      # Release'a. Jeśli tag nie ma odpowiadającego nagłówka (literówka/zapomniany wpis),
      # plik notatek wychodzi po prostu pusty — "gh release create" i tak przyjmie pusty
      # --notes-file, świadomie bez twardego błędu (Release i tak jest szkicem do
      # ręcznego przejrzenia przed publikacją).
      - name: Wyciągnij notatki z CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [$VERSION]" '
            $0 == header { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Utwórz szkic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            artifacts/windows/* artifacts/linux/* artifacts/macros/*
