<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPDM — przeglądarka elementów CAD</title>
    <script>
      // Ustawia klasę "dark" JESZCZE PRZED pierwszym renderem Reacta (ThemeProvider robi to
      // samo już w JS-ie, ale dopiero po zamontowaniu) — bez tego przy starcie z zapisanym
      // motywem jasnym byłoby widać krótkie mignięcie domyślnym ciemnym tłem.
      (function () {
        var stored = localStorage.getItem("pdm_theme")
        var isDark = stored !== "light"
        document.documentElement.classList.toggle("dark", isDark)
      })()
    </script>
