# Dwa sposoby uruchomienia:
#   1. Masz sklonowane całe repo (rozwój/testowanie zmian): "docker compose up -d --build"
#      buduje obraz "api" lokalnie ze źródeł (sekcja "build:" niżej).
#   2. Samo wdrożenie, bez klonowania repo (masz tylko ten plik + .env, np. ściągnięte przez
#      curl): "docker compose pull && docker compose up -d" — ściąga gotowy obraz z GHCR
#      (publikowany automatycznie przez .github/workflows/publish-docker-image.yml przy
#      każdym pushu na main), sekcja "build:" jest wtedy po prostu ignorowana (nieużywana,
#      dopóki ktoś jawnie nie poprosi o build).
# W obu przypadkach najpierw: skopiuj .env.example do .env, ustaw PDM_DB_PASSWORD.
# Pierwsze logowanie: admin / admin (zob. README.md -> "Jak uruchomić").
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdm_user
      POSTGRES_PASSWORD: ${PDM_DB_PASSWORD:?Ustaw PDM_DB_PASSWORD w pliku .env (skopiuj z .env.example)}
      POSTGRES_DB: pdm
    volumes:
      # UWAGA: obraz postgres:18+ oczekuje wolumenu zamontowanego na /var/lib/postgresql
      # (BEZ podkatalogu "/data") — sam zarządza podkatalogiem konkretnej wersji w środku
      # (kompatybilność z pg_ctlcluster/pg_upgrade). Starsza konwencja (.../data) używana
      # przez obrazy postgres:9-17 powoduje w 18+ odmowę startu ("in 18+, these Docker
      # images are configured to store database data in a format which is compatible with
      # pg_ctlcluster...") — potwierdzone w praktyce (zob. https://github.com/docker-library/postgres/pull/1259).
      - pgdata:/var/lib/postgresql
      # Uruchamiane automatycznie przez oficjalny obraz postgres TYLKO przy zupełnie
      # pustym wolumenie danych — czyli tylko przy pierwszym starcie. Kolejne migracje
      # (db/migrations/*.sql, gdy się pojawią po aktualizacji) trzeba na razie zastosować
      # ręcznie: docker compose exec -T postgres psql -U pdm_user -d pdm < db/migrations/xxx.sql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm_user -d pdm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # "image" — używane przez "docker compose pull"/"up" (bez --build): ściąga gotowy obraz
    # zamiast wymagać lokalnego źródła. "build" — używane tylko przez jawne "--build"/"build",
    # gdy masz sklonowane repo i chcesz zbudować własną kopię (np. z lokalnymi zmianami).
    image: ghcr.io/pawelcel/easypdm-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionString: Host=postgres;Port=5432;Database=pdm;Username=pdm_user;Password=${PDM_DB_PASSWORD:?Ustaw PDM_DB_PASSWORD w pliku .env (skopiuj z .env.example)}
    ports:
      # Port hosta parametryzowany zmienną PDM_HOST_PORT (domyślnie 5000) — jeśli 5000 jest
      # już zajęte na tej maszynie (np. przez inny serwis), ustaw PDM_HOST_PORT w .env
      # zamiast edytować ten plik bezpośrednio (edycja tu przeszkadzałaby przy "git pull").
      # Compose scala LISTY (jak "ports") między docker-compose.yml a
      # docker-compose.override.yml przez DOKLEJENIE, nie zastąpienie — więc override z
      # innym portem i tak próbowałby zbindować OBA porty naraz i padał na tym zajętym.
      - "${PDM_HOST_PORT:-5000}:8080"
    volumes:
      # Magazyn plików + automatyczne kopie zapasowe + logi programu — wszystko, co
      # EasyPDM.Api zapisuje poza bazą danych, w jednym miejscu na hoście.
      - pdm-data:/data

volumes:
  pgdata:
  pdm-data:
